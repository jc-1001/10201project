<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認資訊</title>
    <link rel="stylesheet" href="./css/input4-1.css">
    <link rel="stylesheet" href="./css/input-pay-form.css">
</head>
<body>
    <!-- header -->
    <div class="banner">
        <div class="header">
            <div class="logo">
                <img src="./sub-page-Img/contract/logo-small.svg" alt="">
            </div>
            
        </div>
    </div>

    <!-- 進度條 -->
        
        <section class="loading">
            <div class="un-compelet">
                <div class="step-icon">
                    <p>1</p>
                </div>
                <div class="step-txt">
                    <p>預覽契約</p>
                </div>
            </div>


            <!-- <div class="line"></div> -->


            <div class="un-compelet">
                <div class="step-icon">
                    <p>2</p>
                </div>
                <div class="step-txt">
                    <p>填寫付款資訊</p>
                </div>
            </div>



            <!-- <div class="line"></div> -->



            <div class="compelet">
                <div class="step-icon">
                    <p>3</p>
                </div>
                <div class="step-txt">
                    <p>確認資訊</p>
                </div>
            </div>


            <!-- <div class="line"></div> -->



            <div class="un-compelet">
                <div class="step-icon">
                    <p>4</p>
                </div>
                <div class="step-txt">
                    <p>下載文件</p>
                </div>
            </div>
        </section>

        

    <!-- 介面 -->
    <section class="contain-main">
            <h2>您購買方案</h2>
    <div class="buy-sel-cardlist">
        <label class="buy-sel-card">
            <input type="radio" name="plan" value="basic" checked disabled>
            <p>方案：基本版</p>
            <p>金額NT$699~1299</p>
        </label>

        <label class="buy-sel-card">
            <input type="radio" name="plan" value="basic"  disabled>
            <p>方案：專業版</p>
            <p>金額NT$2000</p>
        </label>
    </div>
    
    <br><hr><br>

    <h2>購買資訊</h2>
    <form >
        
        <div class="buy-name1">
            <label for="firstName">First name</label>
            <label for="lastName">Last name</label> 
        </div>
        <div class="buy-name2">
            <input type="text" id="firstName" name="firstName" value="王"  readonly>
            <input type="text" id="lastName" name="lastName"value="小明"  readonly>
        </div>
        <br>

        <div class="buy-email1">
            <label for="email">Email</label>
        </div>
        <div class="buy-email2">
            <input type="email" id="email" name="email" value="abc123@gmail.com"  readonly>
        </div>
        <br>

        <div class="buy-tel1">
            <label for="contactPhone">手機號碼(請依格式填入，如：0912345678 或 +886912345678)</label>
        </div>
        <div class="buy-tel2">
            <input type="tel" id="contactPhone" name="contactPhone" value="0912345678"  readonly>
        </div>
        
        <br><hr><br>

        <h2>信用卡付款資訊</h2>
         <div class="cradicard">
                <h3>本次消費金額：NT 1000 元</h3>

                <div class="form-row">
                    <div class="form-col">
                        <label for="cardType">信用卡類型</label>
                        <select id="cardType" name="cardType" disabled>
                            <option value="Visa" selected>Visa</option>
                            <option value="Master">Master</option>
                            <option value="JCB">JCB</option>
                        </select>
                    </div>
                    <div class="form-col">
                        <label>信用卡有效期限</label>
                        <div class="expiry-group">
                            <select name="expMonth" disabled> 
                                <option value="">月</option>
                                <option value="01">01</option>
                                <option value="02">02</option>
                                <option value="03">03</option>
                                <option value="04">04</option>
                                <option value="05">05</option>
                                <option value="06">06</option>
                                <option value="07" selected>07</option>
                                <option value="08">08</option>
                                <option value="09">09</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                            <select name="expYear" disabled>
                                <option value="">年</option>
                                <option value="2025" >25</option> 
                                <option value="2026" selected>26</option>
                                <option value="2027">27</option>
                                <option value="2028">28</option>
                                <option value="2029">29</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label for="cardHolderName">持卡人姓名</label>
                        <input type="text" id="cardHolderName" name="cardHolderName" value="王小明" readonly>
                    </div>
                    <div class="form-col">
                        <label for="cvc">信用卡背後末三碼</label>
                        <input type="text" id="cvc" name="cvc" maxlength="3" value="123" readonly>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label>信用卡卡號</label>
                        <div class="card-number-group">
                            <input type="text" name="cardNumber1" maxlength="4" value="1234" readonly> 
                            <input type="text" name="cardNumber2" maxlength="4" value="5678" readonly> 
                            <input type="text" name="cardNumber3" maxlength="4" value="1234" readonly> 
                            <input type="text" name="cardNumber4" maxlength="4" value="5678" readonly>
                        </div>
                    </div>
                    <div class="form-col">
                        <label for="paymentPhone">手機號碼</label>
                        <input type="tel" id="paymentPhone" name="paymentPhone" value="0912345678" readonly>
                    </div>
                </div>
            </div>
        </section>


<!-- 按鍵處 -->
            <section class="button-all">
                <a href="./input4.html"><div class="goback">
                    <img src="./sub-page-Img/contract/backicon.svg" alt="">
                    <p>返回上一步</p>
                </div></a>
                <a href="./input5.html"><div class="button">
                    <p>下一步</p>
                </div></a>
            </section>
        </div>



      
</body>
</html>
