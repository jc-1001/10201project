<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填寫資料2</title>
    <link rel="stylesheet" href="./css/input2.css">
</head>
<body>
    <!-- header -->
    <div class="banner">
        <div class="header">
            <div class="logo">
                <img src="./sub-page-Img/contract/logo-small.svg" alt="">
            </div>
            
        </div>
    </div>

    <!-- 進度條 -->
        
        <section class="loading">
            <p>生成文件進度</p>
            <img src="./sub-page-Img/contract/loading2.svg" alt="">
        </section>

        

    <!-- 介面 -->
     <section class="container">
        <!-- 左邊視窗 -->
        <div class="contain-left">
            <!-- 問題一 -->
             <div class="qa1">
                <div class="question">
                    <h2>每月租金多少錢？</h2>
                </div>
            </div>

            <div class="answer">
                <label for="pay1">新台幣</label>
                <input type="number" id="pay1" name="pay1" value="pay1" placeholder="輸入金額" autocomplete="off">元
            </div>

            <!-- 問題二 -->

            <div class="qa2">
                <div class="question">
                    <h2>承租人應於每月幾號支付每期租金？</h2>
                </div>
            </div>

            <div class="answer">
                <label for="patday">每月的</label>
                <input type="number" id="payday" name="payday" value="payday" min="1" max="10">日
            </div>

            <!-- 問題三 -->
            <div class="qa3">
                <div class="question">
                    <h2>支付方式</h2>
                </div>
            </div>

        <div class="answer">
            <div class="option1">
                <input type="radio" id="howtoPay" name="howtoPay" value="howtoPay" checked>
                <label for="howtoPay">現金支付</label>
            </div>

            <div class="option2">
                <input type="radio" id="howtoPay1" name="howtoPay" value="howtoPay1">
                <label for="howtoPay1">轉帳支付</label>
            </div>   
        </div>

        <!-- 問題四 -->
            <div class="qa4">
                <div class="question">
                    <h2>是否有押租金約定？押租金多少錢？</h2>
                </div>
                <div class="hint">
                    <img src="./sub-page-Img/contract/Lightbulb.svg" alt="">
                    <p>小提醒</p>
                    <div class="hint-block">
                        <p>押金不得超過兩個月租金總額且應明確約定押金金額、交付方式及退還條件。</p>
                    </div>
                </div>
                
            </div>

        <div class="answer">
            <div class="option1">
                <input type="radio" id="pre-rant1" name="pre-rant" value="pre-rant1" checked>
                <label for="pre-rant1">無約定</label>
            </div>

            <div class="option2">
                <input type="radio" id="pre-rant2" name="pre-rant" value="pre-rant2">
                <label for="pre-rant2">有押金</label>
            <br>
            <div class="pre-pay-name">
                <label for="pre-pay" class="pre-pay-name"></label>
                押金金額為：新台幣<input type="number" id="pre-pay" name="pre-pay" value="pre-pay" placeholder="輸入金額">元
            </div>
            <br>
                
            </div>
        </div>

        <!-- 按鍵處 -->
            <div class="button-all">
                <a href="./input1.html"><div class="goback">
                    <img src="./sub-page-Img/contract/backicon.svg" alt="">
                    <p>返回上一步</p>
                </div></a>
                <a href="./input3.html"><div class="button">
                    <p>下一步</p>
                </div></a>
            </div>
        </div>


        <!-- 右邊視窗 -->
        <div class="contain-right">
            <div class="view-text">
                <p>預覽：</p>
            </div>
            <div class="view-box">
                <div class="contract">
                    <p>二、租金：</p>
                    <br>
                    <ul>
                        <li>承租人每月租金為<span id="preview-pay1">________</span>元整，應於每月<span id="preview-payday">___</span>日前支付，不得有任何理由拖延或拒絕；出租人於租賃期間亦不得以任何理由要求調漲租金</li>
                        <li>租金支付方式為：<span id="preview-howtoPay">__________________</span></li>
                        
                        <li>押租金約定：<span id="preview-pre-rant-status">無約定/有押金</span>
                        <span id="preview-pre-rant-amount" style="display: none;">，金額為新台幣<span id="preview-pre-pay">________</span>元整。</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>














    </section>

    <script>
        // 1. 取得所有需要監聽的輸入元素(定義id/class名稱)
        const pay1Input = document.getElementById('pay1');
        const paydayInput = document.getElementById('payday');
        const howtoPayRadios = document.querySelectorAll('input[name="howtoPay"]');
        const preRantRadios = document.querySelectorAll('input[name="pre-rant"]');
        const prePayInput = document.getElementById('pre-pay');

        // 2. 取得所有需要更新的預覽元素
        const previewPay1 = document.getElementById('preview-pay1');
        const previewPayday = document.getElementById('preview-payday');
        const previewHowtoPay = document.getElementById('preview-howtoPay');
        const previewPreRantStatus = document.getElementById('preview-pre-rant-status');
        const previewPreRantAmountContainer = document.getElementById('preview-pre-rant-amount');
        const previewPrePay = document.getElementById('preview-pre-pay');

        // --- 監聽事件及更新函式 ---

        // Q1 & Q2: 租金金額和支付日期的更新
        function updatePaymentInfo() {
            // 更新每月租金金額，如果沒輸入就顯示底線
            previewPay1.textContent = pay1Input.value.trim() !== '' ? new Intl.NumberFormat().format(pay1Input.value) : '________';

            // 更新支付日期，如果沒輸入就顯示底線
            previewPayday.textContent = paydayInput.value.trim() !== '' ? paydayInput.value : '___';
        }

        pay1Input.addEventListener('input', updatePaymentInfo);
        paydayInput.addEventListener('input', updatePaymentInfo);


        // Q3: 支付方式的更新
        function updateHowtoPay() {
            let selectedMethod = '';
            // 遍歷所有 radio button
            howtoPayRadios.forEach(radio => {
                if (radio.checked) {
                    // 找到被選中的 radio button 的 label 文本作為支付方式
                    selectedMethod = document.querySelector(`label[for="${radio.id}"]`).textContent;
                }
            });

            previewHowtoPay.textContent = selectedMethod !== '' ? selectedMethod : '__________________';
        }

        howtoPayRadios.forEach(radio => {
            radio.addEventListener('change', updateHowtoPay);
        });


        // Q4: 押租金約定及金額的更新
        function updatePreRantInfo() {
            let statusText = '';
            let isPreRant = false;

            preRantRadios.forEach(radio => {
                if (radio.checked) {
                    // 找到被選中的 radio button 的 label 文本作為狀態
                    statusText = document.querySelector(`label[for="${radio.id}"]`).textContent;
                    if (radio.value === 'pre-rant2') { // 判斷是否為「有押金」
                        isPreRant = true;
                    }
                }
            });

            // 更新狀態 (無約定 / 有押金)
            previewPreRantStatus.textContent = statusText;

            // 根據是否有押金來顯示或隱藏押金金額的預覽區塊
            if (isPreRant) {
                previewPreRantAmountContainer.style.display = 'inline';
                // 更新押金金額
                previewPrePay.textContent = prePayInput.value.trim() !== '' ? new Intl.NumberFormat().format(prePayInput.value) : '________';
            } else {
                previewPreRantAmountContainer.style.display = 'none';
                previewPrePay.textContent = '________'; // 清空金額
            }
        }

        preRantRadios.forEach(radio => {
            radio.addEventListener('change', updatePreRantInfo);
        });

        prePayInput.addEventListener('input', updatePreRantInfo);

        // 頁面載入時執行一次初始化，確保預設值也能顯示
        document.addEventListener('DOMContentLoaded', () => {
            updatePaymentInfo();
            updateHowtoPay();
            updatePreRantInfo();
        });
    </script>


      
</body>
</html>
