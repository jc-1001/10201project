<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選購方案與付款表單</title>
</head>
<body>

    <h2>選取購買方案</h2>
    <div>
        <div>
            方案：基本版<br>
            金額NT$699~1299
        </div>

        <div>
            方案：基本版<br>
            金額NT$699~1299
        </div>
    </div>
    
    <br><hr><br>

    <h2>購買資訊</h2>
    <form action="/process-order" method="POST">
        
        <div>
            <label for="firstName">First name</label>
            <label for="lastName" style="margin-left: 200px;">Last name</label> </div>
        <div>
            <input type="text" id="firstName" name="firstName">
            <input type="text" id="lastName" name="lastName">
        </div>
        <br>

        <div>
            <label for="email">Email</label>
        </div>
        <div>
            <input type="email" id="email" name="email">
        </div>
        <br>

        <div>
            <label for="contactPhone">手機號碼(請依格式填入，如：0912345678 或 +886912345678)</label>
        </div>
        <div>
            <input type="tel" id="contactPhone" name="contactPhone">
        </div>
        
        <br><hr><br>

        <h2>信用卡付款資訊</h2>
        <div style="border: 1px solid #ddd; padding: 20px;"> <h3>本次消費金額：NT 1000 元</h3>

            <table style="width: 100%; border-collapse: collapse;">
                <tr>
                    <td style="width: 50%;">
                        <label for="cardType">信用卡類型</label><br>
                        <input type="text" id="cardType" name="cardType" value="Visa/Master/JCB">
                    </td>
                    <td>
                        <label>信用卡有效期限</label><br>
                        <input type="text" name="expMonth" size="4" placeholder="月"> 
                        <input type="text" name="expYear" size="4" placeholder="年">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="cardHolderName">持卡人姓名</label><br>
                        <input type="text" id="cardHolderName" name="cardHolderName">
                    </td>
                    <td>
                        <label for="cvc">信用卡背後末三碼</label><br>
                        <input type="text" id="cvc" name="cvc" maxlength="3">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>信用卡卡號</label><br>
                        <input type="text" name="cardNumber1" maxlength="4" size="4"> 
                        <input type="text" name="cardNumber2" maxlength="4" size="4"> 
                        <input type="text" name="cardNumber3" maxlength="4" size="4"> 
                        <input type="text" name="cardNumber4" maxlength="4" size="4">
                    </td>
                    <td>
                        <label for="paymentPhone">手機號碼</label><br>
                        <input type="tel" id="paymentPhone" name="paymentPhone">
                    </td>
                </tr>
            </table>

        </div>
        
        <br>
        <button type="submit">確認購買並付款</button>

    </form>

</body>
</body>
</html>
